name: Release

# Builds installers for Windows (.exe), macOS (.dmg, unsigned) and Linux (.AppImage, .deb).
# Publishes a GitHub release with the installers when a tag like v0.2.0 is pushed, or when run
# manually with a version (the tag is then created on the commit being built). Without a version,
# a manual run only uploads the installers as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v0.1.0 (leave empty to only build artifacts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -w @easypixel/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: easypixel-${{ matrix.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: EasyPixel ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*
          generate_release_notes: true
